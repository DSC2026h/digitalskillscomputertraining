<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Skills Computer Training</title>

  <meta name="theme-color" content="#0066cc">
  <meta name="description" content="Digital Skills Computer Training">

  <link rel="manifest" href="./manifest.json">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #0066cc, #00b894);
      color: white;
    }

    .container {
      padding: 50px 20px;
    }

    h1 {
      font-size: 30px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 25px;
      background: white;
      color: #0066cc;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Digital Skills Computer Training</h1>

    <p>
      Learn Computer Fundamentals, Digital Skills,
      Microsoft Office, Coding, Website Development
      and more.
    </p>

    <a href="./index.html">Open Training Website</a>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js")
          .then(function () {
            console.log("Service Worker registered successfully");
          })
          .catch(function (error) {
            console.log("Service Worker registration failed:", error);
          });
      });
    }
  </script>

</body>
</html>
