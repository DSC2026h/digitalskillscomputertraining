
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Skills & Computer Training Hub</title>

  <meta name="theme-color" content="#ff1493">
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        135deg,
        #ff0000,
        #ff8c00,
        #ffd700,
        #00c853,
        #00b0ff,
        #304ffe,
        #9c27b0,
        #ff1493
      );
      background-size: 400% 400%;
      animation: rainbow 15s ease infinite;
    }

    @keyframes rainbow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .app {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
      text-align: center;
    }

    .card {
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      padding: 25px;
      margin-top: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    img {
      max-width: 180px;
      border-radius: 20px;
    }

    h1 {
      color: #7b1fa2;
    }

    .button {
      display: inline-block;
      margin: 8px;
      padding: 14px 22px;
      border-radius: 30px;
      background: linear-gradient(
        90deg,
        #ff0000,
        #ff8c00,
        #00c853,
        #00b0ff,
        #9c27b0,
        #ff1493
      );
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="card">

      <img src="Logo.jpg" alt="Digital Skills Logo">

      <h1>Digital Skills & Computer Training Hub</h1>

      <p>
        Learn computer skills, digital skills, coding,
        Microsoft Office and website development.
      </p>

      <a class="button" href="index.html">Open Main Website</a>

    </div>

  </div>

</body>
</html>
