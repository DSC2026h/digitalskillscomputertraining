<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Certificate Issuing | Digital Skills & Computer Training</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #ff0000,
                #ff7f00,
                #ffff00,
                #00cc44,
                #008cff,
                #4b0082,
                #8f00ff
            );
            min-height: 100vh;
            padding: 30px 15px;
        }

        .admin-box {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.20);
        }

        h1 {
            text-align: center;
            color: #063b8f;
        }

        .admin-badge {
            text-align: center;
            font-size: 45px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #063b8f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0876d1;
        }

        #adminPanel {
            display: none;
        }

        #loginMessage,
        #statusMessage {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }

        .logout {
            background: #b00020;
        }

        .logout:hover {
            background: #d00030;
        }

        .admin-info {
            text-align: center;
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="admin-box">

        <div class="admin-badge">🔐</div>

        <h1>Admin Certificate Issuing</h1>

        <!-- LOGIN PANEL -->
        <div id="loginPanel">

            <p class="admin-info">
                This area is restricted to authorized administration only.
            </p>

            <button type="button" onclick="loginAdmin()">
                🔐 SIGN IN AS ADMINISTRATOR
            </button>

            <p id="loginMessage"></p>

        </div>


        <!-- ADMIN PANEL -->
        <div id="adminPanel">

            <div class="warning">
                🔒 <strong>Authorized Administrator Access</strong><br>
                Only approved administration can issue certificates.
            </div>

            <label for="studentName">
                Student Full Name
            </label>

            <input
                type="text"
                id="studentName"
                placeholder="Enter student's full name"
            >

            <label for="courseName">
                Course Completed
            </label>

            <select id="courseName">

                <option value="">
                    Select Course
                </option>

                <option value="Computer Fundamentals">
                    Computer Fundamentals
                </option>

                <option value="Microsoft Office">
                    Microsoft Office
                </option>

                <option value="Digital Skills">
                    Digital Skills
                </option>

                <option value="Online Skills">
                    Online Skills
                </option>

                <option value="Full Computer Training">
                    Full Computer Training
                </option>

                <option value="Website & App Building">
                    Website & App Building
                </option>

                <option value="Cybersecurity">
                    Cybersecurity
                </option>

            </select>

            <button type="button" onclick="issueCertificate()">
                🏆 ISSUE CERTIFICATE
            </button>

            <p id="statusMessage"></p>

            <button
                type="button"
                class="logout"
                onclick="logoutAdmin()"
            >
                🚪 SIGN OUT
            </button>

        </div>

    </div>


    <!-- FIREBASE LIBRARIES -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


    <!-- FIREBASE ADMIN LOGIN -->
    <script>

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC5C1icpQFZ3DmUyzCPa-Ip2vgONK5aTRQ",
            authDomain: "digital-computer-training-hub.firebaseapp.com",
            projectId: "digital-computer-training-hub",
            storageBucket: "digital-computer-training-hub.firebasestorage.app",
            messagingSenderId: "409120626153",
            appId: "1:409120626153:web:42a0524b0eade38ca26778",
            measurementId: "G-ZCQ01L5WDH"
        };


        // Start Firebase
        firebase.initializeApp(firebaseConfig);


        // Firebase Authentication
        const auth = firebase.auth();


        // AUTHORIZED ADMIN EMAIL
        const ADMIN_EMAIL =
            "digitalskillscomputertrainingh@gmail.com";


        // ADMIN LOGIN
        function loginAdmin() {

            const provider =
                new firebase.auth.GoogleAuthProvider();

            document.getElementById("loginMessage").innerText =
                "Opening Google sign-in...";

            auth.signInWithPopup(provider)

                .then((result) => {

                    const user = result.user;

                    if (
                        !user ||
                        !user.email ||
                        user.email.toLowerCase() !==
                        ADMIN_EMAIL.toLowerCase()
                    ) {

                        auth.signOut();

                        document.getElementById("loginMessage").innerText =
                            "❌ Access denied. This Google account is not authorized.";

                        return;
                    }

                    document.getElementById("loginPanel").style.display =
                        "none";

                    document.getElementById("adminPanel").style.display =
                        "block";

                    document.getElementById("loginMessage").innerText =
                        "";

                })

                .catch((error) => {

                    console.error(error);

                    document.getElementById("loginMessage").innerText =
                        "❌ Sign-in failed: " + error.message;

                });

        }


        // CHECK LOGIN STATUS
        auth.onAuthStateChanged((user) => {

            if (
                user &&
                user.email &&
                user.email.toLowerCase() ===
                ADMIN_EMAIL.toLowerCase()
            ) {

                document.getElementById("loginPanel").style.display =
                    "none";

                document.getElementById("adminPanel").style.display =
                    "block";

            } else {

                document.getElementById("adminPanel").style.display =
                    "none";

                document.getElementById("loginPanel").style.display =
                    "block";

            }

        });


        // ISSUE CERTIFICATE
        function issueCertificate() {

            const studentName =
                document.getElementById("studentName").value.trim();

            const courseName =
                document.getElementById("courseName").value;

            if (studentName === "") {

                document.getElementById("statusMessage").innerText =
                    "❌ Please enter the student's full name.";

                return;

            }

            if (courseName === "") {

                document.getElementById("statusMessage").innerText =
                    "❌ Please select the completed course.";

                return;

            }

            document.getElementById("statusMessage").innerText =
                "⚠️ Admin access confirmed. Certificate issuing will be connected to the secure certificate database next.";

        }


        // LOG OUT
        function logoutAdmin() {

            auth.signOut()

                .then(() => {

                    document.getElementById("adminPanel").style.display =
                        "none";

                    document.getElementById("loginPanel").style.display =
                        "block";

                    document.getElementById("loginMessage").innerText =
                        "You have been signed out.";

                    document.getElementById("statusMessage").innerText =
                        "";

                    document.getElementById("studentName").value =
                        "";

                    document.getElementById("courseName").value =
                        "";

                })

                .catch((error) => {

                    console.error(error);

                    alert(
                        "Sign out failed: " + error.message
                    );

                });

        }

    </script>

</body>
</html>
